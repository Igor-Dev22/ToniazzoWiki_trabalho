<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogicaLis | Dicionário</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-shell">
        <button id="btn-add-term" class="btn-fab" aria-label="Adicionar Termo" title="Adicionar Termo">
            <i class="fas fa-plus"></i>
        </button>

        <button id="nav-favorites" class="favorites-link">
            <i class="fas fa-star"></i> Meus Favoritos
        </button>

        <div id="view-search" class="view-section active">
            <div class="search-layout">
                <aside id="recent-sidebar" class="recent-sidebar visible">
                    <span class="recent-label">Todos os termos</span>
                    <div id="recent-groups" class="recent-groups"></div>
                </aside>

                <main class="search-screen">
                    <div class="search-title-row">
                        <h1 class="search-title">Engenharia de Software</h1>
                        <span id="terms-counter" class="terms-counter"></span>
                    </div>

                    <form id="search-form" class="search-container shadow-card">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" id="search-input" placeholder="Pesquise seu termo..." aria-label="Pesquisar termo" autocomplete="off">
                    </form>

                    <p id="search-empty" class="search-empty">Nenhum termo encontrado para essa busca.</p>
                </main>
            </div>
        </div>

        <div id="view-favorites" class="view-section">
            <main class="favorites-screen">
                <button id="btn-back-from-favorites" class="back-link">
                    <i class="fas fa-arrow-left"></i> Voltar
                </button>
                <h1 class="search-title">Meus Favoritos</h1>

                <ul id="favorites-list" class="favorites-list"></ul>
                <p id="favorites-empty" class="search-empty">Você ainda não tem termos favoritos.</p>
            </main>
        </div>
    </div>

    <div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true">
        <div class="modal-content shadow-card">
            <span class="close-button" tabindex="0" aria-label="Fechar">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <div id="form-modal-overlay" class="modal-overlay" role="dialog" aria-modal="true">
        <div class="modal-content shadow-card">
            <span class="close-form-button" tabindex="0" aria-label="Fechar">&times;</span>
            <h2 id="form-modal-title" style="color:var(--primary-color); margin-bottom:20px">Adicionar Novo Termo</h2>
            <form id="term-form">
                <input type="hidden" id="term-id">
                <input type="text" id="term-name" placeholder="Nome do Termo (Ex: React)" required class="form-input">
                <textarea id="term-desc" placeholder="Digite a descrição detalhada do termo..." required class="form-input" rows="4"></textarea>
                <input type="url" id="term-link" placeholder="Link de Referência (Opcional)" class="form-input">
                <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 10px;">Salvar</button>
            </form>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
